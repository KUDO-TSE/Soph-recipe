<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Les recettes de Soph{% endblock %}</title>
  <meta name="theme-color" content="#16261E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recettes">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    /* Capturé ici, dans le <head>, et non dans app.js : l'événement peut se
       déclencher avant l'exécution d'un script en defer, et il est alors perdu
       définitivement. */
    window.__installEvent = null;
    window.addEventListener("beforeinstallprompt", function (ev) {
      ev.preventDefault();
      window.__installEvent = ev;
      window.dispatchEvent(new Event("install-ready"));
    });
    window.addEventListener("appinstalled", function () {
      window.__installEvent = null;
      try { localStorage.setItem("soph-installed", "1"); } catch (e) {}
    });
  </script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
